<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Document the intended policy for anyone self-hosting behind a CSP:
     script-src 'self' 'unsafe-inline' blob: is required (inline engine plus
     the gif.js worker blob). -->
<title>Terminal Scroller</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
  }

  fieldset {
    border: none;
    padding: 0;
    margin: 0;
  }

  .skip-link {
    position: absolute;
    top: -100px;
    left: 0;
    padding: 8px 16px;
    background: var(--btn-bg);
    color: var(--btn-text);
    text-decoration: none;
    border-radius: 0 0 6px 0;
    z-index: 100;
    transition: top 0.2s;
  }

  .skip-link:focus {
    top: 0;
  }

  .input-area:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
  }

  :root {
    --bg: #1a1a1a;
    --text: #d4d4d4;
    --accent: #d97757;
    --term-bg: #111111;
    --term-border: #333;
    --titlebar: #1a1a1a;
    --input-bg: #141414;
    --input-border: #333;
    --btn-bg: #d97757;
    --btn-text: #fff;
    --btn-hover: #c4684a;
    --glow: none;
  }

  [data-theme="phosphor"] {
    --bg: #0a0a0a; --text: #33ff33; --accent: #33ff33;
    --term-bg: #050505; --term-border: #1a3a1a; --titlebar: #0a0a0a;
    --input-bg: #0a0a0a; --input-border: #1a3a1a;
    --btn-bg: #1a3a1a; --btn-text: #33ff33; --btn-hover: #2a5a2a;
    --glow: 0 0 5px #33ff3366;
  }

  [data-theme="amber"] {
    --bg: #0a0800; --text: #ffb000; --accent: #ffb000;
    --term-bg: #050400; --term-border: #3a2a00; --titlebar: #0a0800;
    --input-bg: #0a0800; --input-border: #3a2a00;
    --btn-bg: #3a2a00; --btn-text: #ffb000; --btn-hover: #5a4a00;
    --glow: 0 0 5px #ffb00066;
  }

  [data-theme="monokai"] {
    --bg: #272822; --text: #f8f8f2; --accent: #a6e22e;
    --term-bg: #1e1f1c; --term-border: #3e3d32; --titlebar: #272822;
    --input-bg: #1e1f1c; --input-border: #3e3d32;
    --btn-bg: #a6e22e; --btn-text: #272822; --btn-hover: #b6f23e;
    --glow: none;
  }

  [data-theme="dracula"] {
    --bg: #282a36; --text: #f8f8f2; --accent: #bd93f9;
    --term-bg: #21222c; --term-border: #44475a; --titlebar: #282a36;
    --input-bg: #21222c; --input-border: #44475a;
    --btn-bg: #bd93f9; --btn-text: #282a36; --btn-hover: #caa4fa;
    --glow: none;
  }

  [data-theme="solarized-dark"] {
    --bg: #002b36; --text: #839496; --accent: #268bd2;
    --term-bg: #001e26; --term-border: #073642; --titlebar: #002b36;
    --input-bg: #001e26; --input-border: #073642;
    --btn-bg: #268bd2; --btn-text: #fdf6e3; --btn-hover: #2aa0e8;
    --glow: none;
  }

  [data-theme="solarized-light"] {
    --bg: #fdf6e3; --text: #657b83; --accent: #268bd2;
    --term-bg: #eee8d5; --term-border: #d3cbb7; --titlebar: #fdf6e3;
    --input-bg: #eee8d5; --input-border: #d3cbb7;
    --btn-bg: #268bd2; --btn-text: #fdf6e3; --btn-hover: #2aa0e8;
    --glow: none;
  }

  [data-theme="nord"] {
    --bg: #2e3440; --text: #d8dee9; --accent: #88c0d0;
    --term-bg: #242933; --term-border: #3b4252; --titlebar: #2e3440;
    --input-bg: #242933; --input-border: #3b4252;
    --btn-bg: #88c0d0; --btn-text: #2e3440; --btn-hover: #8fbcbb;
    --glow: none;
  }

  [data-theme="gruvbox"] {
    --bg: #282828; --text: #ebdbb2; --accent: #fabd2f;
    --term-bg: #1d2021; --term-border: #3c3836; --titlebar: #282828;
    --input-bg: #1d2021; --input-border: #3c3836;
    --btn-bg: #fabd2f; --btn-text: #282828; --btn-hover: #fe8019;
    --glow: none;
  }

  [data-theme="one-dark"] {
    --bg: #282c34; --text: #abb2bf; --accent: #61afef;
    --term-bg: #21252b; --term-border: #3a3f4b; --titlebar: #282c34;
    --input-bg: #21252b; --input-border: #3a3f4b;
    --btn-bg: #61afef; --btn-text: #282c34; --btn-hover: #79bdf5;
    --glow: none;
  }

  [data-theme="tokyo-night"] {
    --bg: #1a1b26; --text: #a9b1d6; --accent: #7aa2f7;
    --term-bg: #16161e; --term-border: #292e42; --titlebar: #1a1b26;
    --input-bg: #16161e; --input-border: #292e42;
    --btn-bg: #7aa2f7; --btn-text: #1a1b26; --btn-hover: #89b4fa;
    --glow: none;
  }

  [data-theme="catppuccin"] {
    --bg: #1e1e2e; --text: #cdd6f4; --accent: #cba6f7;
    --term-bg: #181825; --term-border: #313244; --titlebar: #1e1e2e;
    --input-bg: #181825; --input-border: #313244;
    --btn-bg: #cba6f7; --btn-text: #1e1e2e; --btn-hover: #d4b8fa;
    --glow: none;
  }

  [data-theme="rose-pine"] {
    --bg: #191724; --text: #e0def4; --accent: #c4a7e7;
    --term-bg: #1f1d2e; --term-border: #26233a; --titlebar: #191724;
    --input-bg: #1f1d2e; --input-border: #26233a;
    --btn-bg: #c4a7e7; --btn-text: #191724; --btn-hover: #d4baf7;
    --glow: none;
  }

  [data-theme="cobalt2"] {
    --bg: #193549; --text: #e1efff; --accent: #ffc600;
    --term-bg: #122738; --term-border: #1f4662; --titlebar: #193549;
    --input-bg: #122738; --input-border: #1f4662;
    --btn-bg: #ffc600; --btn-text: #193549; --btn-hover: #ffd340;
    --glow: none;
  }

  [data-theme="material"] {
    --bg: #263238; --text: #eeffff; --accent: #89ddff;
    --term-bg: #1e272c; --term-border: #37474f; --titlebar: #263238;
    --input-bg: #1e272c; --input-border: #37474f;
    --btn-bg: #89ddff; --btn-text: #263238; --btn-hover: #a0e8ff;
    --glow: none;
  }

  [data-theme="ubuntu"] {
    --bg: #300a24; --text: #eeeeec; --accent: #e95420;
    --term-bg: #2c001e; --term-border: #5e2750; --titlebar: #300a24;
    --input-bg: #2c001e; --input-border: #5e2750;
    --btn-bg: #e95420; --btn-text: #fff; --btn-hover: #f26b3a;
    --glow: none;
  }

  [data-theme="powershell"] {
    --bg: #012456; --text: #cccccc; --accent: #2472c8;
    --term-bg: #001b3e; --term-border: #0d3a6e; --titlebar: #012456;
    --input-bg: #001b3e; --input-border: #0d3a6e;
    --btn-bg: #2472c8; --btn-text: #fff; --btn-hover: #3a8ae0;
    --glow: none;
  }

  [data-theme="homebrew"] {
    --bg: #000000; --text: #00ff00; --accent: #00ff00;
    --term-bg: #000000; --term-border: #003300; --titlebar: #0a0a0a;
    --input-bg: #0a0a0a; --input-border: #003300;
    --btn-bg: #003300; --btn-text: #00ff00; --btn-hover: #005500;
    --glow: 0 0 8px #00ff0044;
  }

  [data-theme="matrix"] {
    --bg: #000000; --text: #00ff41; --accent: #00ff41;
    --term-bg: #000000; --term-border: #003b00; --titlebar: #0a0a0a;
    --input-bg: #050505; --input-border: #003b00;
    --btn-bg: #003b00; --btn-text: #00ff41; --btn-hover: #005500;
    --glow: 0 0 10px #00ff4144, 0 0 20px #00ff4122;
  }

  [data-theme="minimal"] {
    --bg: #2d2d2d; --text: #f0f0f0; --accent: #aaa;
    --term-bg: #1e1e1e; --term-border: #444; --titlebar: #2d2d2d;
    --input-bg: #252525; --input-border: #444;
    --btn-bg: #555; --btn-text: #f0f0f0; --btn-hover: #666;
    --glow: none;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
    transition: background 0.3s, color 0.3s;
  }

  .container {
    width: 100%;
    max-width: 820px;
    transition: max-width 0.2s;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .header h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent);
  }

  .theme-select {
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.8rem;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }

  .theme-select:focus-visible {
    border-color: var(--accent);
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  .theme-select option { background: var(--bg); color: var(--text); }

  .input-area {
    margin-bottom: 16px;
  }

  textarea {
    width: 100%;
    height: 120px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    padding: 12px;
    border-radius: 8px;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus-visible {
    border-color: var(--accent);
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  textarea:disabled { opacity: 0.5; }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .controls button {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    font-family: inherit;
    font-size: 0.85rem;
    padding: 8px 24px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .controls button:hover { background: var(--btn-hover); }
  .controls button:disabled { opacity: 0.4; cursor: default; }
  .controls button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .controls button.secondary {
    background: transparent;
    border: 1px solid var(--input-border);
    color: var(--text);
  }

  .controls button.secondary:hover { background: var(--input-bg); }

  .settings {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .setting-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .setting-group label {
    font-size: 0.75rem;
    opacity: 0.6;
    white-space: nowrap;
  }

  .setting-group .radio-label {
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s;
  }

  .setting-group .radio-label:has(input:focus-visible) {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .setting-group .radio-label:has(input:checked) {
    opacity: 1;
  }

  .setting-group input[type="radio"] {
    accent-color: var(--accent);
    margin: 0 2px 0 0;
    cursor: pointer;
  }

  .setting-group input[type="number"] {
    width: 70px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.8rem;
    padding: 5px 8px;
    border-radius: 6px;
    outline: none;
    text-align: center;
  }

  .setting-group input[type="number"]:focus-visible {
    border-color: var(--accent);
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .setting-group input[type="text"] {
    width: 180px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.8rem;
    padding: 5px 8px;
    border-radius: 6px;
    outline: none;
  }

  .setting-group input[type="text"]:focus-visible {
    border-color: var(--accent);
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .terminal {
    border: 1px solid var(--term-border);
    border-radius: 10px;
    overflow: hidden;
    transition: max-width 0.2s;
  }

  .titlebar {
    background: var(--titlebar);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--term-border);
  }

  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.red { background: #ff5f57; }
  .dot.yellow { background: #febc2e; }
  .dot.green { background: #28c840; }

  .titlebar-text {
    margin-left: 8px;
    font-size: 0.75rem;
    opacity: 0.5;
  }

  .terminal-body {
    background: var(--term-bg);
    padding: 16px;
    overflow-y: auto;
    font-size: 0.85rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    text-shadow: var(--glow);
  }

  .cursor {
    display: inline;
    animation: blink 0.8s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .speed-indicator {
    margin-top: 8px;
    font-size: 0.7rem;
    opacity: 0.4;
    text-align: right;
    height: 1.2em;
  }

  .gif-status {
    margin-top: 6px;
    font-size: 0.75rem;
    opacity: 0.6;
    text-align: center;
    min-height: 1.4em;
  }

  .noscript {
    margin-bottom: 16px;
    padding: 10px 14px;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    font-size: 0.85rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
    body, .container, .terminal, textarea,
    .controls button, .setting-group .radio-label,
    .skip-link {
      transition: none;
    }
  }
</style>
</head>
<body>

<a href="#inputSection" class="skip-link">Skip to input</a>
<main>

<div class="container" id="container">

<noscript><p class="noscript">Terminal Scroller needs JavaScript to run. Enable it and reload the page.</p></noscript>

<header class="header">
  <h1>terminal-scroller</h1>
  <label for="themeSelect" class="visually-hidden">Theme</label>
  <select class="theme-select" id="themeSelect">
    <option value="claude">Claude Code</option>
    <option value="phosphor">Green Phosphor</option>
    <option value="amber">Amber CRT</option>
    <option value="matrix">Matrix</option>
    <option value="homebrew">Homebrew</option>
    <option value="monokai">Monokai</option>
    <option value="dracula">Dracula</option>
    <option value="solarized-dark">Solarized Dark</option>
    <option value="solarized-light">Solarized Light</option>
    <option value="nord">Nord</option>
    <option value="gruvbox">Gruvbox</option>
    <option value="one-dark">One Dark</option>
    <option value="tokyo-night">Tokyo Night</option>
    <option value="catppuccin">Catppuccin Mocha</option>
    <option value="rose-pine">Rose Pine</option>
    <option value="cobalt2">Cobalt2</option>
    <option value="material">Material</option>
    <option value="ubuntu">Ubuntu</option>
    <option value="powershell">PowerShell</option>
    <option value="minimal">Minimal</option>
  </select>
</header>

<div class="input-area" id="inputSection" tabindex="-1" aria-label="Input section">
  <label for="inputText" class="visually-hidden">Terminal output text</label>
  <textarea id="inputText" placeholder="Paste your text here..."></textarea>
  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn" class="secondary" disabled>Stop</button>
    <button id="resetBtn" class="secondary">Reset</button>
    <button id="gifBtn" class="secondary">Export GIF</button>
  </div>
</div>

<div class="settings">
  <fieldset class="setting-group">
    <legend class="visually-hidden">Speed mode</legend>
    <label class="radio-label"><input type="radio" name="speedMode" value="accelerating" checked> Accelerating</label>
    <label class="radio-label"><input type="radio" name="speedMode" value="constant"> Constant</label>
  </fieldset>
  <div class="setting-group">
    <label for="termCols">Cols</label>
    <input type="number" id="termCols" value="80" min="20" max="300">
  </div>
  <div class="setting-group">
    <label for="termRows">Rows</label>
    <input type="number" id="termRows" value="20" min="5" max="80">
  </div>
  <div class="setting-group">
    <label for="termDuration">Duration (s)</label>
    <input type="number" id="termDuration" value="" min="1" max="600" placeholder="auto">
  </div>
  <div class="setting-group">
    <label for="termTitle">Title</label>
    <input type="text" id="termTitle" value="~/output" placeholder="Terminal title">
  </div>
</div>

<div class="terminal">
  <div class="titlebar">
    <span class="dot red" aria-hidden="true"></span>
    <span class="dot yellow" aria-hidden="true"></span>
    <span class="dot green" aria-hidden="true"></span>
    <span class="titlebar-text" id="titlebarText">~/output</span>
  </div>
  <div class="terminal-body" id="terminalBody" role="log" aria-label="Terminal output"><span class="cursor" id="cursor" aria-hidden="true">█</span></div>
</div>

<div class="speed-indicator" id="speedIndicator" aria-hidden="true"></div>
<div class="gif-status" id="gifStatus" role="status" aria-live="polite"></div>

</div><!-- /container -->

<script>
  const CONFIG = {
    tickFloor: 4,           // setTimeout minimum wait; also the catch-up batch granularity
    frameMinMs: 20,         // minimum GIF frame duration / sampling threshold
    maxFrames: 300,         // GIF frame cap for small canvases
    gifMemoryBudget: 150e6, // approx bytes of RGBA frames to allow (width*height*4*frames)
    durationFactor: 0.95,   // breathing room under the target duration
    finalFrameHold: 2000,   // how long the last GIF frame is held
    autoInitial: 80,        // auto accelerating mode: starting ms/word
    autoMin: 2,             // auto accelerating mode: minimum ms/word
    autoConstant: 80,       // auto constant mode: ms/word
    decayRatio: 40,         // accelerating curve ratio (initial / final)
    readableMs: 60,         // two-phase pacing: ms/word for the readable prefix
    fontStack: "'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace",
  };

  const themeSelect = document.getElementById('themeSelect');
  const inputText = document.getElementById('inputText');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const stopBtn = document.getElementById('stopBtn');
  const gifBtn = document.getElementById('gifBtn');
  const terminalBody = document.getElementById('terminalBody');
  const cursor = document.getElementById('cursor');
  const speedIndicator = document.getElementById('speedIndicator');
  const gifStatus = document.getElementById('gifStatus');
  const termCols = document.getElementById('termCols');
  const termRows = document.getElementById('termRows');
  const termDuration = document.getElementById('termDuration');
  const termTitleInput = document.getElementById('termTitle');
  const titlebarText = document.getElementById('titlebarText');

  let animationId = null;
  let running = false;
  let session = null;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

  function measureChar() {
    const probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font:inherit;';
    probe.textContent = 'M';
    terminalBody.appendChild(probe);
    const w = probe.getBoundingClientRect().width;
    const h = parseFloat(getComputedStyle(terminalBody).lineHeight);
    probe.remove();
    return { w, h };
  }

  const container = document.getElementById('container');

  function clampNumber(value, min, max, fallback) {
    const n = parseFloat(value);
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  function getCols() { return clampNumber(termCols.value, 20, 300, 80); }
  function getRows() { return clampNumber(termRows.value, 5, 80, 20); }
  function getDurationS() { return clampNumber(termDuration.value, 1, 600, 0); }

  function applyTerminalSize() {
    const cols = getCols();
    const rows = getRows();
    const ch = measureChar();
    const padding = 32;
    const totalWidth = Math.round(ch.w * cols + padding + 2);
    terminalBody.style.height = Math.round(ch.h * rows + padding) + 'px';
    container.style.maxWidth = totalWidth + 'px';
  }

  const SETTINGS_KEY = 'terminal-scroller-settings';

  function saveSettings() {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({
      cols: getCols(),
      rows: getRows(),
      duration: getDurationS(),
      title: termTitleInput.value,
      speedMode: getSpeedMode(),
    }));
  }

  function loadSettings() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(SETTINGS_KEY)); } catch { /* ignore */ }
    if (!s || typeof s !== 'object') return;
    termCols.value = clampNumber(s.cols, 20, 300, 80);
    termRows.value = clampNumber(s.rows, 5, 80, 20);
    termDuration.value = s.duration > 0 ? clampNumber(s.duration, 1, 600, 0) : '';
    if (typeof s.title === 'string') {
      termTitleInput.value = s.title;
      titlebarText.textContent = s.title || '~/output';
    }
    if (s.speedMode === 'accelerating' || s.speedMode === 'constant') {
      document.querySelector(`input[name="speedMode"][value="${s.speedMode}"]`).checked = true;
    }
  }

  termCols.addEventListener('change', () => { applyTerminalSize(); saveSettings(); });
  termRows.addEventListener('change', () => { applyTerminalSize(); saveSettings(); });
  termDuration.addEventListener('change', saveSettings);
  termTitleInput.addEventListener('input', () => {
    titlebarText.textContent = termTitleInput.value;
    saveSettings();
  });
  document.querySelectorAll('input[name="speedMode"]').forEach(r => {
    r.addEventListener('change', saveSettings);
  });

  const savedTheme = localStorage.getItem('terminal-scroller-theme') || 'claude';
  themeSelect.value = savedTheme;
  applyTheme(savedTheme);
  loadSettings();
  requestAnimationFrame(applyTerminalSize);

  function applyTheme(theme) {
    const valid = [...themeSelect.options].some(o => o.value === theme);
    if (!valid) theme = 'claude';
    if (theme === 'claude') {
      document.body.removeAttribute('data-theme');
    } else {
      document.body.setAttribute('data-theme', theme);
    }
    localStorage.setItem('terminal-scroller-theme', theme);
  }

  themeSelect.addEventListener('change', () => applyTheme(themeSelect.value));

  function getSpeedMode() {
    return document.querySelector('input[name="speedMode"]:checked').value;
  }

  function computeDelayParams(totalWords) {
    const targetMs = getDurationS() * 1000;
    const mode = getSpeedMode();

    if (mode === 'constant') {
      const delay = targetMs > 0 ? (targetMs * CONFIG.durationFactor) / totalWords : CONFIG.autoConstant;
      return { mode: 'constant', delay: Math.max(delay, 0.5), readableCount: 0 };
    }

    if (!targetMs || targetMs <= 0) return { mode: 'accelerating', initial: CONFIG.autoInitial, min: CONFIG.autoMin, readableCount: 0 };

    const N = totalWords;
    const r = CONFIG.decayRatio;
    const k = 1 / r;
    const kn = Math.pow(k, 1 / N);
    const discreteSum = (1 - k) / (1 - kn);
    let initial = targetMs * CONFIG.durationFactor / discreteSum;

    if (initial >= CONFIG.readableMs) {
      return { mode: 'accelerating', initial, min: Math.max(initial / r, 0.5), readableCount: 0 };
    }

    const READABLE_MS = CONFIG.readableMs;
    const readableBudget = Math.min(targetMs * 0.25, 2000);
    const readableCount = Math.max(1, Math.min(Math.floor(readableBudget / READABLE_MS), Math.floor(N * 0.05)));
    const remainingMs = Math.max(100, targetMs * CONFIG.durationFactor - readableCount * READABLE_MS);
    const remainingN = N - readableCount;

    const kn2 = Math.pow(k, 1 / remainingN);
    const sum2 = (1 - k) / (1 - kn2);
    let fastInitial = remainingMs / sum2;
    fastInitial = Math.max(fastInitial, 0.5);

    return { mode: 'accelerating', initial: fastInitial, min: Math.max(fastInitial / r, 0.1), readableCount, readableMs: READABLE_MS };
  }

  function getDelay(wordIdx, total, params) {
    if (params.mode === 'constant') return params.delay;
    if (wordIdx < params.readableCount) return params.readableMs;
    const span = total - params.readableCount;
    const progress = span > 0 ? (wordIdx - params.readableCount) / span : 0;
    return params.initial * Math.pow(params.min / params.initial, progress);
  }

  function tokenize(raw) {
    // Words keep their trailing whitespace, so indentation, tabs, and column
    // alignment survive. Newlines are separate tokens.
    const lines = raw.split('\n');
    const tokens = [];
    for (let i = 0; i < lines.length; i++) {
      const matches = lines[i].match(/[\t ]*\S+[\t ]*/g) || [];
      for (const m of matches) tokens.push(m);
      if (i < lines.length - 1) tokens.push('\n');
    }
    return tokens;
  }

  function stop() {
    if (animationId !== null) {
      clearTimeout(animationId);
      animationId = null;
    }
    running = false;
    startBtn.disabled = false;
    startBtn.textContent = session && session.idx < session.total ? 'Resume' : 'Start';
    stopBtn.disabled = true;
    inputText.disabled = false;
    gifBtn.disabled = false;
    cursor.style.display = 'inline';
    // Turn live announcements back on so the final text stays accessible.
    terminalBody.setAttribute('aria-live', 'polite');
  }

  function finish() {
    stop();
    startBtn.textContent = 'Start';
    session = null;
    speedIndicator.removeAttribute('aria-hidden');
    speedIndicator.textContent = 'Finished printing output.';
  }

  function announceProgress(percent) {
    // The indicator is aria-hidden from assistive tech; temporarily expose
    // it so this milestone is announced, then hide it again.
    speedIndicator.removeAttribute('aria-hidden');
    speedIndicator.textContent = percent > 0
      ? `Printing: ${percent}% complete.`
      : 'Started printing output.';
    // Force a re-announcement even when the text didn't change.
    if (percent > 0) speedIndicator.textContent += '\u00a0';
    requestAnimationFrame(() => speedIndicator.setAttribute('aria-hidden', 'true'));
  }

  function reset() {
    stop();
    startBtn.textContent = 'Start';
    session = null;
    terminalBody.innerHTML = '';
    terminalBody.appendChild(cursor);
    cursor.style.display = 'inline';
  }

  function wordNode(tokens, idx) {
    const token = tokens[idx];
    const needsSpace = idx > 0 && tokens[idx - 1] !== '\n' && token !== '\n' && !/[\t ]$/.test(tokens[idx - 1]);
    return document.createTextNode(token === '\n' ? '\n' : (needsSpace ? ' ' : '') + token);
  }

  function settingsSignature() {
    return [getSpeedMode(), getDurationS()].join('|');
  }

  function start() {
    const raw = inputText.value.trim();
    if (!raw) return;

    // Resume the paused session when neither the text nor the pacing
    // settings changed, otherwise start fresh.
    if (session && session.raw === raw && session.settings === settingsSignature() && session.idx < session.total) {
      session.runningFrom = performance.now() - session.elapsed;
    } else {
      reset();
      session = {
        raw,
        settings: settingsSignature(),
        tokens: tokenize(raw),
        idx: 0,
        scheduled: 0,
        runningFrom: null,
        elapsed: 0,
        nextAnnounce: 0,
        delayParams: null,
      };
      session.total = session.tokens.length;
      session.delayParams = computeDelayParams(session.total);
    }

    running = true;
    startBtn.disabled = true;
    startBtn.textContent = 'Start';
    stopBtn.disabled = false;
    inputText.disabled = true;
    gifBtn.disabled = true;

    // Streaming thousands of DOM changes into a live region would flood
    // screen readers, so announcements pause while printing.
    terminalBody.setAttribute('aria-live', 'off');

    // For users who prefer reduced motion, dump the output instantly.
    if (reducedMotion.matches) {
      const frag = document.createDocumentFragment();
      while (session.idx < session.total) {
        frag.appendChild(wordNode(session.tokens, session.idx));
        session.idx++;
      }
      terminalBody.insertBefore(frag, cursor);
      terminalBody.scrollTop = terminalBody.scrollHeight;
      finish();
      return;
    }

    function printNext(now) {
      if (session.idx >= session.total || !running) {
        finish();
        return;
      }

      if (session.runningFrom === null) session.runningFrom = now;
      const elapsed = now - session.runningFrom;
      session.elapsed = elapsed;

      // Catch up to the schedule in one batch, inserting all due words in a
      // single fragment and scrolling once. Timestamp-based pacing keeps the
      // Duration target accurate even when timers are throttled or delayed.
      const frag = document.createDocumentFragment();
      let batchCount = 0;
      while (session.idx < session.total && session.scheduled <= elapsed) {
        frag.appendChild(wordNode(session.tokens, session.idx));
        session.scheduled += getDelay(session.idx, session.total, session.delayParams);
        session.idx++;
        batchCount++;
      }
      if (batchCount > 0) {
        terminalBody.insertBefore(frag, cursor);
        terminalBody.scrollTop = terminalBody.scrollHeight;
      }

      const progress = session.idx / session.total;
      if (progress >= session.nextAnnounce) {
        announceProgress(Math.round(progress * 10) * 10);
        session.nextAnnounce = progress + 0.1;
      }

      animationId = setTimeout(() => printNext(performance.now()), Math.max(session.scheduled - elapsed, CONFIG.tickFloor));
    }

    printNext(performance.now());
  }

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
  resetBtn.addEventListener('click', reset);

  // --- GIF Export ---

  let workerBlobUrl = null;

  const GIF_JS_URL = 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js';
  const GIF_WORKER_URL = 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js';
  // SRI digests for the pinned gif.js@0.2.0 release. Reject anything that
  // doesn't match so a compromised or rewritten CDN response can't run.
  const GIF_JS_INTEGRITY = 'sha384-4RMW82CWFobXY+HRHXe5go/V5acBhiIVGCT+2k7TEoxi7AiWKw8WoWb9qMU+FAFu';
  const GIF_WORKER_INTEGRITY = 'sha384-uL0SwIQSos1DfQU2KzlDbPuSz7Jwo+hmNPIhe86VJ+MWwyj0DvjngnAgWrkNi9eQ';

  async function sha384b64(text) {
    // Encode as UTF-8 bytes first: a tampered script containing non-Latin-1
    // characters would otherwise crash String.fromCharCode.
    const bytes = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest('SHA-384', bytes);
    return 'sha384-' + btoa(String.fromCharCode(...new Uint8Array(digest)));
  }

  async function loadGifJs() {
    if (window.GIF && workerBlobUrl) return;
    const [gifRes, workerRes] = await Promise.all([fetch(GIF_JS_URL), fetch(GIF_WORKER_URL)]);
    if (!gifRes.ok || !workerRes.ok) {
      throw new Error(`Failed to load gif.js (HTTP ${gifRes.status}/${workerRes.status})`);
    }
    const [gifScript, workerScript] = await Promise.all([gifRes.text(), workerRes.text()]);
    const [gifHash, workerHash] = await Promise.all([sha384b64(gifScript), sha384b64(workerScript)]);
    if (gifHash !== GIF_JS_INTEGRITY || workerHash !== GIF_WORKER_INTEGRITY) {
      throw new Error('gif.js failed integrity check; not executing CDN code');
    }
    if (!window.GIF) {
      const s = document.createElement('script');
      s.textContent = gifScript;
      document.head.appendChild(s);
    }
    if (!workerBlobUrl) {
      const blob = new Blob([workerScript], { type: 'application/javascript' });
      workerBlobUrl = URL.createObjectURL(blob);
    }
  }

  function createLayoutState(ctx, tokens, style) {
    // Incremental word-wrap layout: state advances token by token, so
    // rendering N frames costs O(total tokens) instead of O(frames x tokens).
    const { width, fontSize, padding, rows } = style;
    const maxWidth = width - padding * 2;
    const lines = [[]];
    let lineX = 0;
    let upto = 0;
    // Lines far above the scrollback viewport can never be painted again,
    // so drop them to bound memory on very long exports.
    const maxRetained = rows + 2;
    let trimmed = 0;

    function advance(uptoIdx) {
      ctx.font = `${fontSize}px ${style.font}`;
      for (; upto <= uptoIdx && upto < tokens.length; upto++) {
        const tok = tokens[upto];
        if (tok === '\n') {
          lines.push([]);
          lineX = 0;
          if (lines.length > maxRetained) {
            const drop = lines.length - maxRetained;
            lines.splice(0, drop);
            trimmed += drop;
          }
          continue;
        }
        const prefix = (upto > 0 && tokens[upto - 1] !== '\n' && !/[\t ]$/.test(tokens[upto - 1])) ? ' ' : '';
        const text = prefix + tok;
        const measured = ctx.measureText(text).width;
        const current = lines[lines.length - 1];
        if (lineX + measured > maxWidth && current.length > 0) {
          lines.push([]);
          lineX = 0;
        }
        const drawText = lineX === 0 ? tok : text;
        const drawWidth = lineX === 0 ? ctx.measureText(drawText).width : measured;
        lines[lines.length - 1].push({ text: drawText, width: drawWidth });
        lineX += drawWidth;
      }
    }

    function endOf(line) {
      let w = 0;
      for (const seg of line) w += seg.width;
      return w;
    }

    return { advance, lines, endOf, get trimmed() { return trimmed; } };
  }

  function renderFrame(canvas, ctx, layoutState, wordIdx, style) {
    const { width, height, font, fontSize, lineHeight, padding, bg, fg, titlebarHeight } = style;

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, width, height);

    // titlebar
    ctx.fillStyle = style.titlebar;
    ctx.fillRect(0, 0, width, titlebarHeight);
    const dotY = titlebarHeight / 2;
    const dotR = 5;
    ctx.beginPath(); ctx.arc(14, dotY, dotR, 0, Math.PI * 2); ctx.fillStyle = '#ff5f57'; ctx.fill();
    ctx.beginPath(); ctx.arc(32, dotY, dotR, 0, Math.PI * 2); ctx.fillStyle = '#febc2e'; ctx.fill();
    ctx.beginPath(); ctx.arc(50, dotY, dotR, 0, Math.PI * 2); ctx.fillStyle = '#28c840'; ctx.fill();
    ctx.fillStyle = fg;
    ctx.globalAlpha = 0.4;
    ctx.font = `${fontSize * 0.85}px ${font}`;
    ctx.fillText(style.title, 66, dotY + fontSize * 0.3);
    ctx.globalAlpha = 1.0;

    layoutState.advance(wordIdx);
    const lines = layoutState.lines;
    const bodyTop = titlebarHeight + padding;
    const bodyHeight = height - bodyTop - padding;
    const totalTextHeight = (lines.length + layoutState.trimmed) * lineHeight;
    const scrollOffset = Math.max(0, totalTextHeight - bodyHeight);
    const yOffset = scrollOffset - layoutState.trimmed * lineHeight;

    // clip to body area
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, bodyTop, width, bodyHeight + padding);
    ctx.clip();

    ctx.font = `${fontSize}px ${font}`;
    ctx.fillStyle = fg;

    const lastLine = lines.length - 1;
    const lastVisible = Math.min(Math.ceil((bodyTop + yOffset + bodyHeight - fontSize) / lineHeight), lastLine);
    for (let l = Math.max(0, lastVisible - Math.ceil(bodyHeight / lineHeight) - 1); l <= lastVisible; l++) {
      const drawY = bodyTop + fontSize + l * lineHeight - yOffset;
      let x = padding;
      for (const seg of lines[l]) {
        ctx.fillText(seg.text, x, drawY);
        x += seg.width;
      }
    }

    // cursor at the end of the last laid-out line
    const cursorX = padding + layoutState.endOf(lines[lastLine]);
    const cursorY = bodyTop + fontSize + lastLine * lineHeight - yOffset;
    if (cursorY >= bodyTop && cursorY <= height - padding) {
      ctx.fillStyle = fg;
      ctx.fillRect(cursorX + 2, cursorY - fontSize + 2, fontSize * 0.55, fontSize);
    }

    ctx.restore();
  }

  function getComputedThemeColors() {
    const cs = getComputedStyle(document.body);
    return {
      bg: cs.getPropertyValue('--term-bg').trim(),
      fg: cs.getPropertyValue('--text').trim(),
      titlebar: cs.getPropertyValue('--titlebar').trim(),
    };
  }

  async function exportGif() {
    const raw = inputText.value.trim();
    if (!raw) { gifStatus.textContent = 'Enter text first.'; return; }

    gifStatus.textContent = 'Loading gif.js...';
    try { await loadGifJs(); } catch (e) { gifStatus.textContent = e.message; return; }

    gifBtn.disabled = true;
    startBtn.disabled = true;
    gifStatus.textContent = 'Rendering frames...';

    const tokens = tokenize(raw);
    const total = tokens.length;
    const colors = getComputedThemeColors();

    const cols = getCols();
    const rows = getRows();
    const fontSize = 14;
    const lineHeight = fontSize * 1.6;
    const padding = 16;
    const titlebarHeight = 36;
    const font = CONFIG.fontStack;
    const title = termTitleInput.value || '~/output';

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    // Measure the actual monospace advance width so wrapping matches the
    // on-screen terminal instead of assuming a 0.6 ratio.
    ctx.font = `${fontSize}px ${font}`;
    const charWidth = ctx.measureText('M'.repeat(10)).width / 10;
    const width = Math.round(charWidth * cols + padding * 2);
    const height = Math.round(lineHeight * rows + padding * 2 + titlebarHeight);
    canvas.width = width;
    canvas.height = height;

    const style = { width, height, font, fontSize, lineHeight, padding, titlebarHeight, title, rows, ...colors };

    // Every queued frame is held in memory as a full RGBA bitmap until the
    // workers finish, so cap the frame count for large canvases.
    const maxFrames = Math.max(30, Math.min(CONFIG.maxFrames, Math.floor(CONFIG.gifMemoryBudget / (width * height * 4))));
    const MIN_FRAME_MS = CONFIG.frameMinMs;

    const gif = new GIF({
      workers: 2,
      quality: 10,
      width,
      height,
      workerScript: workerBlobUrl,
    });

    function endExport() {
      gifBtn.disabled = false;
      startBtn.disabled = false;
      // Release the worker pool and per-frame RGBA buffers held by gif.js.
      [...gif.freeWorkers, ...gif.activeWorkers].forEach(w => w.terminate());
      gif.frames.length = 0;
      gif.imageParts = null;
    }

    const delayParams = computeDelayParams(total);

    // Build frame list with adaptive sampling: accumulate delay until
    // it exceeds a threshold, then emit a frame. Early slow words get
    // one frame per word; fast tail words get batched into fewer frames.
    const frames = [];
    let accDelay = 0;
    for (let i = 0; i < total; i++) {
      accDelay += getDelay(i, total, delayParams);
      if (accDelay >= MIN_FRAME_MS || i === total - 1) {
        frames.push({ wordIdx: i, delay: Math.max(MIN_FRAME_MS, Math.round(accDelay)) });
        accDelay = 0;
      }
    }

    // If too many frames, downsample the tail (keep early frames intact)
    if (frames.length > maxFrames) {
      const keep = Math.floor(maxFrames * 0.4);
      const tail = frames.slice(keep);
      const tailStep = Math.ceil(tail.length / (maxFrames - keep));
      const sampled = frames.slice(0, keep);
      for (let i = 0; i < tail.length; i += tailStep) {
        let mergedDelay = 0;
        for (let j = i; j < Math.min(i + tailStep, tail.length); j++) {
          mergedDelay += tail[j].delay;
        }
        sampled.push({ wordIdx: tail[Math.min(i + tailStep - 1, tail.length - 1)].wordIdx, delay: mergedDelay });
      }
      frames.length = 0;
      frames.push(...sampled);
    }

    const layoutState = createLayoutState(ctx, tokens, style);
    for (let f = 0; f < frames.length; f++) {
      renderFrame(canvas, ctx, layoutState, frames[f].wordIdx, style);
      gif.addFrame(ctx, { copy: true, delay: frames[f].delay });
      if (f % 15 === 0) {
        gifStatus.textContent = `Rendering frames... ${Math.round((f / frames.length) * 100)}%`;
        await new Promise(r => setTimeout(r, 0));
      }
    }

    // final frame with all text, held longer
    renderFrame(canvas, ctx, layoutState, total - 1, style);
    gif.addFrame(ctx, { copy: true, delay: CONFIG.finalFrameHold });

    gifStatus.textContent = 'Encoding GIF...';

    gif.on('finished', blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'terminal-scroller.gif';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      gifStatus.textContent = 'GIF saved!';
      endExport();
    });

    gif.on('progress', p => {
      gifStatus.textContent = `Encoding GIF... ${Math.round(p * 100)}%`;
    });

    gif.on('abort', () => {
      gifStatus.textContent = 'GIF encoding aborted.';
      endExport();
    });

    try {
      gif.render();
    } catch (e) {
      gifStatus.textContent = 'GIF encoding failed: ' + e.message;
      endExport();
    }
  }

  gifBtn.addEventListener('click', exportGif);
</script>

</main>

</body>
